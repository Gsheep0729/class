<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>苹果风格计数器</title>
  <script src="https://unpkg.com/vue@3.4.19/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f5f7ff 0%, #eef2f8 100%);
      padding: 20px;
    }
    
    #app {
      width: 100%;
      max-width: 500px;
      perspective: 1000px;
    }
    
    .apple-counter {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 12px 30px rgba(0, 0, 0, 0.05),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.9);
      padding: 30px;
      overflow: hidden;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.28, 0.84, 0.42, 1);
    }
    
    .apple-counter::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(90deg, #4b93ff, #61dafb, #b05efd);
      border-radius: 24px 24px 0 0;
      opacity: 0.7;
    }
    
    .counter-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 0 35px;
    }
    
    .counter-value {
      font-size: 5.5rem;
      font-weight: 700;
      background: linear-gradient(45deg, #0d72ed, #8a4af3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -2px;
      position: relative;
      transition: transform 0.3s ease;
    }
    
    .counter-subtitle {
      color: #86868b;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-top: 10px;
    }
    
    .controls-section {
      padding: 0 15px;
    }
    
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .apple-button {
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.28, 0.84, 0.42, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    
    .apple-button:after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
      z-index: -1;
    }
    
    .apple-button:hover:after {
      transform: translateX(100%);
    }
    
    .increment-btn {
      background-color: rgba(13, 114, 237, 0.15);
      color: #0d72ed;
      border: 1px solid rgba(13, 114, 237, 0.2);
    }
    
    .increment-btn:hover {
      background-color: rgba(13, 114, 237, 0.2);
    }
    
    .decrement-btn {
      background-color: rgba(235, 87, 87, 0.15);
      color: #eb5757;
      border: 1px solid rgba(235, 87, 87, 0.2);
    }
    
    .decrement-btn:hover {
      background-color: rgba(235, 87, 87, 0.2);
    }
    
    .reset-btn {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.65);
      color: white;
      border: 1px solid rgba(0, 0, 0, 0.2);
      padding: 17px;
    }
    
    .reset-btn:hover {
      background-color: rgba(0, 0, 0, 0.75);
    }
    
    .history-section {
      margin-top: 35px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
      background: rgba(245, 245, 247, 0.4);
    }
    
    .section-header {
      padding: 18px 20px;
      background-color: rgba(245, 245, 247, 0.6);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: 0.2px;
    }
    
    .history-list {
      padding: 15px 0;
    }
    
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
      transition: background-color 0.3s ease;
      border-bottom: 1px solid rgba(0, 0, 0, 0.02);
    }
    
    .history-item:hover {
      background-color: rgba(255, 255, 255, 0.6);
    }
    
    .history-action {
      font-weight: 500;
    }
    
    .history-time {
      color: #86868b;
      font-size: 0.9rem;
    }
    
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.08), transparent);
      margin: 30px 50px;
    }
    
    @media (max-width: 500px) {
      .apple-counter {
        padding: 25px 20px;
      }
      
      .counter-value {
        font-size: 4.5rem;
      }
      
      .controls-grid {
        gap: 15px;
      }
      
      .apple-button {
        padding: 15px;
      }
    }
    
    .pop-animation {
      animation: pop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="apple-counter">
      <div class="counter-display">
        <div class="counter-value" :class="{'pop-animation': animate}">{{ count }}</div>
        <div class="counter-subtitle">当前计数</div>
      </div>
      
      <div class="controls-section">
        <div class="controls-grid">
          <button 
            class="apple-button decrement-btn" 
            @click="decrement"
            :disabled="count <= 0"
          >
            <i class="fas fa-minus"></i> 减少
          </button>
          
          <button 
            class="apple-button increment-btn" 
            @click="increment"
          >
            <i class="fas fa-plus"></i> 增加
          </button>
        </div>
        
        <button 
          class="apple-button reset-btn"
          @click="reset"
          :disabled="count === 0"
        >
          <i class="fas fa-arrow-rotate-left"></i> 重置计数器
        </button>
      </div>
      
      <div class="divider"></div>
      
      <div class="history-section" v-if="history.length > 0">
        <div class="section-header">最近操作</div>
        <div class="history-list">
          <div class="history-item" v-for="(item, index) in history" :key="index">
            <div class="history-action">
              <span v-if="item.type === '增加'"><i class="fas fa-plus-circle" style="color: #0d72ed"></i> 增加计数</span>
              <span v-else-if="item.type === '减少'"><i class="fas fa-minus-circle" style="color: #eb5757"></i> 减少计数</span>
              <span v-else><i class="fas fa-rotate-left" style="color: #333"></i> 重置计数</span>
            </div>
            <div class="history-time">{{ item.timestamp }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const { createApp, ref } = Vue;
    
    const app = createApp({
      setup() {
        const count = ref(0);
        const history = ref([]);
        const animate = ref(false);
        
        const increment = () => {
          count.value++;
          animate.value = true;
          setTimeout(() => animate.value = false, 300);
          logHistory('增加');
        };
        
        const decrement = () => {
          if (count.value > 0) {
            count.value--;
            animate.value = true;
            setTimeout(() => animate.value = false, 300);
            logHistory('减少');
          }
        };
        
        const reset = () => {
          if (count.value !== 0) {
            count.value = 0;
            animate.value = true;
            setTimeout(() => animate.value = false, 300);
            logHistory('重置');
          }
        };
        
        const logHistory = (action) => {
          history.value.unshift({
            type: action,
            timestamp: new Date().toLocaleTimeString('zh-CN', { 
              hour: '2-digit', 
              minute: '2-digit',
              second: '2-digit'
            })
          });
          
          if (history.value.length > 4) {
            history.value.pop();
          }
        };
        
        return {
          count,
          history,
          animate,
          increment,
          decrement,
          reset
        };
      }
    });
    
    app.mount('#app');
  </script>
</body>
</html>
