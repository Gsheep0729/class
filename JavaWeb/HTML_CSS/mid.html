<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册表单</title>
  <style>
    form {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    fieldset {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ddd;
    }
    legend {
      font-weight: bold;
      padding: 0 10px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form action="/register" method="post">
    <fieldset>
      <legend>基本信息</legend>
      
      <div class="form-group">
        <label for="username">用户名:</label>
        <input type="text" id="username" name="username" required>
      </div>
      
      <div class="form-group">
        <label for="password">密码:</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
    </fieldset>
    
    <fieldset>
      <legend>个人信息</legend>
      
      <div class="form-group">
        <label>性别:</label>
        <div>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">男</label>
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">女</label>
        </div>
      </div>
      
      <div class="form-group">
        <label for="birthdate">出生日期:</label>
        <input type="date" id="birthdate" name="birthdate">
      </div>
      
      <div class="form-group">
        <label for="city">所在城市:</label>
        <select id="city" name="city">
          <option value="">--请选择--</option>
          <option value="beijing">北京</option>
          <option value="shanghai">上海</option>
          <option value="guangzhou">广州</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="intro">个人简介:</label>
        <textarea id="intro" name="intro" rows="4"></textarea>
      </div>
    </fieldset>
    
    <fieldset>
      <legend>账号设置</legend>
      
      <div class="form-group">
        <label for="avatar">上传头像:</label>
        <input type="file" id="avatar" name="avatar">
      </div>
      
      <div class="form-group">
        <label>订阅通知:</label>
        <div>
          <input type="checkbox" id="news" name="subscriptions" value="news">
          <label for="news">最新资讯</label>
          <input type="checkbox" id="promo" name="subscriptions" value="promo">
          <label for="promo">促销活动</label>
        </div>
      </div>
    </fieldset>
    
    <input type="hidden" name="token" value="abc123xyz">
    
    <div class="btn-group">
      <button type="submit">注册</button>
      <button type="reset">重置</button>
      <button type="button" onclick="preview()">预览</button>
    </div>
  </form>
</body>
</html>
