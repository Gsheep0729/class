<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>数据类型与变量示例</title>
</head>
<body>
    <h3>打开浏览器控制台（F12）查看输出结果</h3>

    <script>
        // ==================== 1. 变量（let/var）====================
        console.log("===== 变量示例 =====");
        
        // let声明变量（块级作用域，推荐）
        let age = 20; // 初始为数字
        console.log("let声明的age初始值：", age, "类型：", typeof age);
        
        age = "二十岁"; // 动态修改为字符串（弱类型特性）
        console.log("修改后的age：", age, "类型：", typeof age);
        
        // 变量命名规则（合法与非法示例）
        let userName = "Alice"; // 小驼峰命名（推荐）
        let $score = 95;
        let _count = 10;
        // let 2ndPlace; // 错误：数字开头（取消注释会报错）
        // let my-name; // 错误：含连字符（取消注释会报错）
        
        // var声明变量（不推荐，函数级作用域）
        function testVar() {
            if (true) {
                var x = 10; // var作用域为函数级，而非块级
            }
            console.log("var声明的x（函数内可见）：", x); // 输出10（块外仍可访问）
        }
        testVar();


        // ==================== 2. 常量（const）====================
        console.log("\n===== 常量示例 =====");
        
        // 基本类型常量（不可重新赋值）
        const PI = 3.14159;
        console.log("常量PI：", PI);
        // PI = 3.14; // 错误：常量不可重新赋值（取消注释会报错）
        
        // 引用类型常量（引用不可改，内部内容可改）
        const USER = { name: "Bob", age: 22 };
        console.log("常量USER初始值：", USER);
        USER.age = 23; // 允许修改内部属性
        console.log("修改后USER.age：", USER.age); // 输出23
        // USER = { name: "Charlie" }; // 错误：不可修改引用（取消注释会报错）
        
        const COLORS = ["red", "green"];
        COLORS.push("blue"); // 允许修改数组内容
        console.log("修改后COLORS数组：", COLORS); // 输出["red", "green", "blue"]


        // ==================== 3. 基本数据类型 ====================
        console.log("\n===== 基本数据类型示例 =====");
        
        // 1. number（数字）
        let num1 = 100; // 整数
        let num2 = 3.14; // 小数
        let num3 = -5; // 负数
        let num4 = NaN; // 非数字（Not a Number）
        console.log("number类型：", num1, num2, num3, "NaN === NaN？", num4 === NaN); // NaN不等同于自身
        console.log("判断NaN：", isNaN(num4)); // 输出true（正确判断NaN的方式）
        
        // 2. string（字符串）
        let str1 = '单引号字符串';
        let str2 = "双引号字符串";
        let str3 = `反引号模板字符串`;
        // 模板字符串拼接变量
        let name = "Tom";
        console.log('我叫'+name+'，今年'+age+'（字符串拼接）');
        let ageStr = `我叫${name}，今年${age}（变量动态拼接）`;
        console.log("模板字符串：", ageStr);
        // 多行字符串
        let multiLine = `第一行
 第二行
第三行`;
        console.log("多行字符串：\n", multiLine);
        
        // 3. boolean（布尔值）
        let isTrue = true;
        let isFalse = false;
        console.log("boolean类型：", isTrue, isFalse, "true转换为数字：", Number(isTrue)); // true→1
        
        // 4. undefined（未定义）
        let uninit; // 声明未初始化
        let obj = { prop: "value" };
        console.log("undefined示例：", uninit, obj.nonExistentProp); // 未声明属性返回undefined
        
        // 5. null（空值）
        let emptyValue = null;
        console.log("null值：", emptyValue, "null的typeof结果：", typeof emptyValue); // 注意：typeof null返回"object"


        // ==================== 4. 引用数据类型 ====================
        console.log("\n===== 引用数据类型示例 =====");
        
        // 1. object（对象）
        let person = {
            name: "Lily",
            age: 20,
            isStudent: true
        };
        console.log("object类型：", person, "访问属性：", person.name);
        person.age = 21; // 修改对象属性
        console.log("修改后person.age：", person.age);
        
        // 2. array（数组）
        let fruits = ["apple", "banana", "cherry"];
        console.log("array类型：", fruits, "数组长度：", fruits.length);
        fruits[1] = "orange"; // 修改数组元素
        console.log("修改后数组：", fruits);
        
        // 基本类型vs引用类型赋值差异
        // 基本类型：复制值
        let a = 10;
        let b = a;
        b = 20;
        console.log("基本类型赋值（a不受b影响）：a=", a, "b=", b); // a=10, b=20
        
        // 引用类型：复制引用
        let arr1 = [1, 2, 3];
        let arr2 = arr1;
        arr2.push(4);
        console.log("引用类型赋值（arr1受arr2影响）：arr1=", arr1, "arr2=", arr2); // 两者都变为[1,2,3,4]


        // ==================== 5. 类型检测 ====================
        console.log("\n===== 类型检测示例 =====");
        
        console.log("检测number：", typeof 123); // "number"
        console.log("检测string：", typeof "hello"); // "string"
        console.log("检测boolean：", typeof false); // "boolean"
        console.log("检测undefined：", typeof undefined); // "undefined"
        console.log("检测null（特殊）：", typeof null); // "object"（需单独判断）
        console.log("正确检测null：", emptyValue === null); // true
        
        console.log("检测object：", typeof { key: "value" }); // "object"
        console.log("检测array（typeof不足）：", typeof [1, 2]); // "object"
        console.log("正确检测array：", Array.isArray([1, 2])); // true


        // ==================== 6. 类型转换 ====================
        console.log("\n===== 类型转换示例 =====");
        
        // 1. 隐式转换（自动发生）
        console.log("隐式转换：10 + '20' =", 10 + "20"); // 数字+字符串→字符串"1020"
        console.log("隐式转换：'5' - 3 =", "5" - 3); // 字符串-数字→数字2
        console.log("隐式转换：Boolean(0) =", Boolean(0)); // 0→false（falsy值）
        
        // 2. 显式转换
        // 转数字
        console.log("字符串转数字：Number('123') =", Number("123"), "parseInt('45px') =", parseInt("45px"));
        // 转字符串
        console.log("数字转字符串：String(678) =", String(678), "(true).toString() =", (true).toString());
        // 转布尔值
        console.log("转布尔值：", "Boolean('') =", Boolean(''), "Boolean('非空字符串') =", Boolean("非空字符串"));


        // ==================== 7. 输出语句 ====================
        console.log("\n===== 输出语句示例 =====");
        
        // 1. alert（弹出警告框，运行时会阻塞页面）
        alert("这是alert输出：演示基本数据类型与变量"); // 取消注释会弹出弹窗
        
        // 2. console.log（控制台输出，最常用）
        console.log("这是console.log输出：用于调试");
        console.log("多值输出：", 123, "abc", true);
        
        // 3. document.write（写入页面，不推荐）
        // document.write("<p>这是document.write写入的内容</p>"); // 取消注释会在页面添加内容
    </script>
</body>
</html>
